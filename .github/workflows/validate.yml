name: Validate CityInsight
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/run_pipeline.py
        env:
          MPLBACKEND: Agg
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_dashboard.py
      - name: Check generated data is reproducible
        run: git diff --exit-code -- data/raw/city_indicators_2024_mvp.csv data/processed dashboard/data docs/analysis_report_2024_mvp.md
